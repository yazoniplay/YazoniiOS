name: Gemini Auto-Fix Regression Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/intentional-failure-test.yml"
      - "tests/autofix_fixture.py"
      - "tests/test_autofix_fixture.py"

permissions:
  contents: read

jobs:
  regression-test:
    name: Regression test for calculate_total
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Explain the test fixture
        run: |
          echo "TEST-ONLY fixture: tests/autofix_fixture.py"
          echo "Expected behavior: calculate_total([1, 2, 3]) returns 6."
          echo "The fixture contains a deterministic off-by-one bug."

      - name: Run regression test
        run: python tests/test_autofix_fixture.py
