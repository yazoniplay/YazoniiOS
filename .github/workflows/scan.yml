name: YazoniiOS automated prospect scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_PATH: yazonii.db
          DEFAULT_QUERIES: ${{ vars.DEFAULT_QUERIES }}
          MAX_RESULTS_PER_QUERY: ${{ vars.MAX_RESULTS_PER_QUERY }}
          REDDIT_MAX_AGE_DAYS: ${{ vars.REDDIT_MAX_AGE_DAYS }}
          MAX_CRAWL_PAGES: ${{ vars.MAX_CRAWL_PAGES }}
          HONOR_ROBOTS: "true"
        run: python scheduler.py

      - name: Persist database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yazonii.db
          git diff --cached --quiet || git commit -m "Update prospect database"
          git push
