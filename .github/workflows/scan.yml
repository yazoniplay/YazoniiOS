name: YazoniiOS automated prospect scan

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: yazoniiOS-scan
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notify Discord - scan started
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import requests

          webhook = os.environ["DISCORD_WEBHOOK_URL"]
          payload = {
              "username": "YazoniiOS",
              "embeds": [{
                  "title": "🟢 YazoniiOS scan started",
                  "description": "A new automated prospect scan has started.",
                  "color": 0x57F287,
                  "fields": [
                      {"name": "Status", "value": "Running", "inline": True},
                      {"name": "Trigger", "value": os.environ.get("GITHUB_EVENT_NAME", "unknown"), "inline": True},
                  ],
                  "footer": {"text": "YazoniiOS automated worker"}
              }]
          }
          response = requests.post(webhook, json=payload, timeout=15)
          response.raise_for_status()
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_PATH: yazonii.db
          DEFAULT_QUERIES: "need a website,looking for a web designer,need a web developer,website redesign,need a website developer,looking for a website developer,need help with website,need an online store,need a Shopify website,need an ecommerce website,website is outdated,website not mobile friendly,website project"
          MAX_RESULTS_PER_QUERY: "20"
          REDDIT_MAX_AGE_DAYS: "5"
          MAX_CRAWL_PAGES: "12"
          HONOR_ROBOTS: "true"
        run: python run_scan.py

      - name: Persist database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@noreply.github.com"

          # Stage and commit the generated DB before rebasing.
          # Rebase refuses to run while the working tree has unstaged changes.
          git add -f yazonii.db
          git diff --cached --quiet || git commit -m "Update prospect database"

          # Code changes may have landed while this scan was running.
          # The DB commit is now clean, so it can safely be rebased onto latest main.
          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main

      - name: Notify Discord - scan crashed
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import requests

          webhook = os.environ["DISCORD_WEBHOOK_URL"]
          payload = {
              "username": "YazoniiOS",
              "embeds": [{
                  "title": "🔴 YazoniiOS scan crashed",
                  "description": "The automated scan failed. Check the GitHub Actions run logs.",
                  "color": 0xED4245,
                  "fields": [
                      {"name": "Status", "value": "Failed", "inline": True},
                      {"name": "Run", "value": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}", "inline": False},
                  ],
                  "footer": {"text": "YazoniiOS automated worker"}
              }]
          }
          response = requests.post(webhook, json=payload, timeout=15)
          response.raise_for_status()
          PY
