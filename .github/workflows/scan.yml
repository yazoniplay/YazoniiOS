name: YazoniiOS automated prospect scan

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_PATH: yazonii.db
          DEFAULT_QUERIES: dentist stockholm,restaurant stockholm,construction company stockholm
          MAX_RESULTS_PER_QUERY: "20"
          REDDIT_MAX_AGE_DAYS: "5"
          MAX_CRAWL_PAGES: "12"
          HONOR_ROBOTS: "true"
        run: python run_scan.py

      - name: Persist database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yazonii.db
          git diff --cached --quiet || git commit -m "Update prospect database"
          git push
